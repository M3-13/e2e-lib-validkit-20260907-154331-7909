[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Kleine Python-Bibliothek mit Prüf- und Normalisierungsfunktionen (nur Standardbibliothek)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "validkit contributors" }]
keywords = ["validation", "normalization", "luhn", "iban", "isbn", "email"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://example.com"

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
